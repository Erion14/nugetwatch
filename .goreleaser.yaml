version: 2

project_name: nugetwatch

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/nugetwatch
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - contrib/**/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
